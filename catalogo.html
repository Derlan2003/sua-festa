<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#222757">
<meta property="og:title" content="Veja as opções do catálogo">
<meta property="og:description" content="Toque em “Quero esta” na opção que você gostar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{--navy:#222757;--teal:#13998a;--green:#8cc63f;--green-d:#76ad2c;--orange:#f28c28;--blue:#2ea8dc;--sky:#9dc8ee;--pink:#fbb8b0;--ink:#3d4166;--muted:#6b6f8c;--line:#ebebf2;--soft:#f4f7fb}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--navy);font-family:Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  a{color:var(--teal)}
  button{font:inherit}
  button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .topo{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 var(--line)}
  .topo-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:24px}
  .logo{height:64px;width:auto;display:block;flex:none}
  .marca{font-size:22px;font-weight:900}
  .menu{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
  .menu::-webkit-scrollbar{display:none}
  .menu button{flex:none;cursor:pointer;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--navy);font-size:15px;font-weight:800;white-space:nowrap}
  .menu button:hover{background:var(--soft)}
  .menu button.on{background:var(--navy);color:#fff}
  .faixa{display:grid;grid-template-columns:repeat(6,1fr);height:5px}
  .hero{background:var(--soft);padding:36px 20px 32px;text-align:center}
  .hero h1{margin:0;font-size:34px;line-height:1.1;font-weight:900}
  .hero p{margin:10px auto 0;max-width:520px;font-size:16px;line-height:1.5;color:var(--ink);text-wrap:pretty}
  .chip{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 16px;border-radius:999px;background:#fff;font-size:14px;font-weight:800;color:var(--navy)}
  .chip i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--green)}
  main{max-width:1120px;margin:0 auto;padding:28px 20px 32px}
  .lgpd{max-width:640px;margin:0 auto;padding:8px 20px 140px;font-size:13px;line-height:1.55;color:var(--muted)}
  .lgpd-box{border-radius:16px;background:var(--soft)}
  .lgpd-btn{cursor:pointer;width:100%;min-height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border:0;border-radius:16px;background:transparent;color:var(--ink);font-size:14px;font-weight:700;text-align:left}
  .lgpd-btn:hover{background:#eaf0f7}
  .lgpd-btn svg{flex:none;color:var(--teal)}
  .lgpd-btn .seta{margin-left:auto;width:24px;height:24px}
  .lgpd.aberto .lgpd-btn .seta{transform:rotate(180deg)}
  .lgpd .gaveta-in>div{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px;opacity:0;transition:opacity .35s ease}
  .lgpd.aberto .gaveta{grid-template-rows:1fr}
  .lgpd.aberto .gaveta-in>div{opacity:1;transition-delay:.08s}
  .lgpd ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .lgpd li{display:flex;gap:8px;color:var(--ink);text-wrap:pretty}
  .lgpd li:before{content:"";flex:none;width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--teal)}
  .lgpd-links{display:flex;flex-wrap:wrap;gap:6px 16px}
  .lgpd a{color:var(--navy);font-weight:800}
  .lgpd-rod{margin:12px 0 0;text-align:center;font-size:12px}
  .info{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;font-size:15px;color:var(--muted)}
  .info strong{white-space:nowrap;color:var(--navy);font-size:20px;font-weight:900}
  .grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 24px;align-items:start}
  .kit{display:flex;flex-direction:column;gap:12px}
  .foto{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--soft)}
  .foto img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .kit:hover .foto img{transform:scale(1.03)}
  .selo{white-space:nowrap;position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;font-weight:800}
  .selo.escolha{left:auto;right:12px;background:var(--orange);color:var(--navy)}
  .kit.escolhido .foto{box-shadow:0 0 0 3px var(--orange)}
  .cat{font-size:13px;font-weight:700;color:var(--muted)}
  .kit h2{margin:-6px 0 0;font-size:20px;line-height:1.2;font-weight:900}
  .desc{margin:0;font-size:14px;line-height:1.5;color:var(--ink);text-wrap:pretty}
  .valores{margin-top:auto;padding-top:4px;border-radius:16px;background:var(--soft);transition:box-shadow .3s}
  .kit.aberto .valores{box-shadow:0 0 0 2px var(--line)}
  .abrir{cursor:pointer;width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border:0;border-radius:16px;background:transparent;color:var(--navy);text-align:left}
  .abrir:hover{background:#eaf0f7}
  .abrir b{font-size:16px;font-weight:900;white-space:nowrap}
  .abrir small{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
  .abrir small em{font-style:normal;font-size:18px;font-weight:900;color:var(--teal)}
  .seta{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#fff;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .kit.aberto .seta{transform:rotate(180deg)}
  .gaveta{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}
  .kit.aberto .gaveta{grid-template-rows:1fr}
  .gaveta-in{min-height:0;overflow:hidden}
  .opcoes{display:flex;flex-direction:column;gap:10px;padding:0 10px 10px;opacity:0;transform:translateY(-8px);transition:opacity .35s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
  .kit.aberto .opcoes{opacity:1;transform:none;transition-delay:.08s}
  .op{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:#fff}
  .como{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:14px;line-height:1.45;color:var(--ink);text-wrap:pretty}
  .como svg{flex:none;margin-top:1px;color:var(--teal)}
  .como strong{color:var(--navy)}
  @media (prefers-reduced-motion:reduce){.gaveta,.opcoes,.seta,.lgpd .gaveta-in>div{transition:none}}
  .op-l{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .op-l span{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
  .op-l strong{font-size:20px;font-weight:900;color:var(--teal)}
  .quero{cursor:pointer;min-height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--green);color:var(--navy);font-size:16px;font-weight:900;text-align:center}
  .quero:hover{background:var(--green-d)}
  .quero:active{transform:translateY(1px)}
  .indisp{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:999px;background:#e6e7ee;color:var(--muted);font-size:15px;font-weight:800}
  .vazio{grid-column:1/-1;margin:0;padding:40px 0;font-size:16px;color:var(--muted);text-align:center}
  #aviso{position:fixed;left:12px;right:12px;bottom:12px;display:none;max-width:560px;margin:0 auto;background:var(--navy);color:#fff;padding:16px 18px;border-radius:16px;font-size:15px;line-height:1.45;box-shadow:0 10px 30px rgba(34,39,87,.3);border-left:6px solid var(--green)}
  @media (max-width:1060px) and (min-width:901px){.abrir{padding:0 12px;gap:8px}.abrir small i{display:none}}
  @media (max-width:900px){.grade{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){
    .topo-in{flex-direction:column;align-items:stretch;gap:6px;padding:10px 12px 8px}
    .logo{height:52px;margin:0 auto}
    .marca{text-align:center}
    .menu{margin:0 auto;max-width:100%}
    .hero{padding:24px 16px}
    .hero h1{font-size:28px}
    main{padding:20px 16px 24px}
    .grade{grid-template-columns:minmax(0,1fr);gap:32px}
  }
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div id="marca"></div>
    <nav class="menu" id="menu" aria-label="Categorias"></nav>
  </div>
  <div class="faixa" aria-hidden="true"><span style="background:var(--sky)"></span><span style="background:var(--green)"></span><span style="background:var(--orange)"></span><span style="background:var(--blue)"></span><span style="background:var(--pink)"></span><span style="background:var(--teal)"></span></div>
</header>
<section class="hero" id="hero">
  <h1>Nossas opções</h1>
  <p>Carregando o catálogo…</p>
</section>
<main id="app"></main>
<footer class="lgpd" id="lgpd"></footer>
<div id="aviso" role="status"></div>
<script>
(function(){
  var C=window.SF_CONFIG||{},API=(C.url||'')+'/functions/v1/catalogo';
  var q=new URLSearchParams(location.search),T=(q.get('t')||'').replace(/[^a-f0-9]/gi,''),CAT=q.get('c')||'';
  var app=document.getElementById('app'),aviso=document.getElementById('aviso'),menu=document.getElementById('menu'),hero=document.getElementById('hero'),marca=document.getElementById('marca');
  var D=null,filtro=null,enviando=false,abertos={},vistos={};
  var ICO={
    decoracao_completa:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>',
    pegue_monte:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/></svg>'
  };
  var COMO={
    decoracao_completa:'<strong>Nós fazemos tudo:</strong> levamos, montamos e retiramos depois. Você só aproveita a festa.',
    pegue_monte:'<strong>Você monta:</strong> retira a decoração no nosso endereço, monta e devolve depois.'
  };
  var LOGOS={'sua festa':'logo-sua-festa.png'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function brl(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:Number(v)%1?2:0,maximumFractionDigits:2});}
  function dataBR(d){var p=String(d).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
  function post(b){b.t=T;return fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:C.anonKey||'',Authorization:'Bearer '+(C.anonKey||'')},body:JSON.stringify(b)}).then(function(r){return r.json();});}
  function falha(msg){hero.innerHTML='<h1>Catálogo indisponível</h1><p>'+esc(msg)+' Peça um novo link na conversa do WhatsApp.</p>';}
  function mostrarAviso(html){aviso.innerHTML=html;aviso.style.display='block';}
  function topo(){
    var lg=D.logo||LOGOS[String(D.empresa||'').trim().toLowerCase()];
    marca.innerHTML=lg?'<img class="logo" src="'+esc(lg)+'" alt="'+esc(D.empresa)+'">':'<span class="marca">'+esc(D.empresa)+'</span>';
    var emp=esc(D.empresa||'a empresa');
    document.getElementById('lgpd').innerHTML='<div class="lgpd-box"><button class="lgpd-btn" id="lgpd-btn" aria-expanded="false">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>'+
      '<span>Seus dados protegidos · LGPD</span><span class="seta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>'+
      '<div class="gaveta"><div class="gaveta-in"><div><ul>'+
        '<li><span>Registramos quais opções você abre e escolhe, para '+emp+' atender o seu pedido.</span></li>'+
        '<li><span>Esses registros ajudam '+emp+' a medir os anúncios dela na Meta. Seu telefone vai criptografado e nenhuma mensagem é compartilhada.</span></li>'+
        '<li><span>Sem cookies e sem rastreio no seu navegador.</span></li>'+
        '<li><span>Não quer participar? É só avisar na conversa e paramos em até 2 dias úteis.</span></li>'+
      '</ul><div class="lgpd-links"><a href="privacidade.html#catalogo-anuncios" target="_blank" rel="noopener">Política de privacidade</a><a href="termos.html" target="_blank" rel="noopener">Termos de uso</a><a href="exclusao-de-dados.html" target="_blank" rel="noopener">Excluir meus dados</a></div></div></div></div></div>'+
      '<p class="lgpd-rod">Catálogo de '+emp+' · tecnologia Clientello</p>';
    document.getElementById('lgpd-btn').onclick=function(){var ft=document.getElementById('lgpd'),on=!ft.classList.contains('aberto');ft.classList.toggle('aberto',on);this.setAttribute('aria-expanded',on?'true':'false');};
    hero.innerHTML='<h1>Nossas opções</h1><p>Veja as fotos, toque em <strong>Ver valores</strong> e escolha como prefere a sua decoração. A sua escolha vai direto para a conversa.</p>'+
      (D.data?'<span class="chip"><i></i>Disponibilidade para '+dataBR(D.data)+'</span>':'');
  }
  function render(){
    var cats=[];D.kits.forEach(function(k){if(k.categoria&&cats.indexOf(k.categoria)<0)cats.push(k.categoria);});cats.sort();
    var m='';if(cats.length>1)[null].concat(cats).forEach(function(c){m+='<button class="'+(filtro===c?'on':'')+'" data-cat="'+esc(c==null?'':c)+'">'+esc(c==null?'Todas':c)+'</button>';});
    menu.innerHTML=m;
    var lista=D.kits.filter(function(k){return !filtro||k.categoria===filtro;});
    var h='<div class="info"><strong>'+esc(filtro||'Todas as opções')+'</strong><span>'+lista.length+(lista.length===1?' opção':' opções')+'</span></div><section class="grade">';
    if(!lista.length)h+='<p class="vazio">Nenhuma opção nesta categoria.</p>';
    lista.forEach(function(k){
      var aberto=abertos[k.id]!=null?abertos[k.id]:!!k.escolhido,min=Math.min.apply(null,k.opcoes.map(function(o){return Number(o.preco)||0;}));
      h+='<article class="kit'+(k.escolhido?' escolhido':'')+(aberto?' aberto':'')+'">'+
        '<div class="foto">'+(k.foto?'<img src="'+esc(k.foto)+'" alt="'+esc(k.nome)+'" loading="lazy">':'')+
          (k.categoria&&!filtro?'<span class="selo">'+esc(k.categoria)+'</span>':'')+
          (k.escolhido?'<span class="selo escolha">Sua escolha</span>':'')+'</div>'+
        (k.categoria&&filtro?'<span class="cat">'+esc(k.categoria)+'</span>':'')+
        '<h2>'+esc(k.nome)+'</h2>'+
        (k.descricao?'<p class="desc">'+esc(k.descricao)+'</p>':'');
      h+='<div class="valores"><button class="abrir" data-abrir="'+esc(k.id)+'" aria-expanded="'+(aberto?'true':'false')+'">'+
          '<b>Ver valores</b><small>'+(k.opcoes.length>1?'<i style="font-style:normal">a partir de </i>':'')+'<em>'+brl(min)+'</em></small>'+
          '<span class="seta"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>'+
        '<div class="gaveta"><div class="gaveta-in"><div class="opcoes">';
      k.opcoes.forEach(function(o){
        h+='<div class="op"><div class="op-l"><span>'+esc(o.nome)+'</span><strong>'+brl(o.preco)+'</strong></div>'+
          (COMO[o.modalidade]?'<p class="como">'+ICO[o.modalidade]+'<span>'+COMO[o.modalidade]+'</span></p>':'')+
          (o.livre?'<button class="quero" data-kit="'+esc(k.id)+'" data-mod="'+esc(o.modalidade)+'">Quero esta</button>'
                  :'<span class="indisp">Indisponível nessa data</span>')+'</div>';
      });
      h+='</div></div></div></div></article>';
    });
    app.innerHTML=h+'</section>';
  }
  menu.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    filtro=b.getAttribute('data-cat')||null;render();window.scrollTo(0,0);
  });
  app.addEventListener('click',function(e){
    var a=e.target.closest('button[data-abrir]');
    if(a){var id0=a.getAttribute('data-abrir'),art=a.closest('.kit'),on=!art.classList.contains('aberto');
      art.classList.toggle('aberto',on);a.setAttribute('aria-expanded',on?'true':'false');abertos[id0]=on;if(on&&!vistos[id0]){vistos[id0]=1;post({acao:'ver_kit',produto_id:id0}).catch(function(){});}return;}
    var b=e.target.closest('button[data-kit]');if(!b||enviando)return;
    enviando=true;b.textContent='Enviando…';
    var id=b.getAttribute('data-kit'),mod=b.getAttribute('data-mod');
    post({acao:'escolher',produto_id:id,modalidade:mod}).then(function(r){
      enviando=false;
      if(r.erro){b.textContent='Quero esta';mostrarAviso(esc(r.erro));return;}
      D.kits.forEach(function(k){k.escolhido=k.id===id;});render();
      var k=D.kits.filter(function(x){return x.id===id;})[0];
      mostrarAviso('<strong>Pronto! Enviamos sua escolha: '+esc(k?k.nome:'')+'.</strong><br>Pode voltar para o WhatsApp, a gente continua por lá.');
    }).catch(function(){enviando=false;b.textContent='Quero esta';mostrarAviso('Não conseguimos enviar agora. Tente de novo em instantes.');});
  });
  if(T.length<20||!C.url){falha('Este link está incompleto.');return;}
  post({acao:'ver',c:CAT}).then(function(r){
    if(r.erro){falha(r.erro+'.');return;}
    D=r;document.title='Catálogo · '+r.empresa;
    if(CAT){var lc=CAT.toLowerCase();D.kits.forEach(function(k){if(k.categoria&&k.categoria.toLowerCase()===lc)filtro=k.categoria;});}
    topo();render();
  }).catch(function(){falha('Não conseguimos abrir o catálogo agora.');});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#222757">
<link rel="icon" type="image/png" sizes="32x32" href="/icone-sua-festa-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icone-sua-festa-192.png">
<link rel="apple-touch-icon" href="/icone-sua-festa-180.png">
<meta property="og:title" content="Veja as opções do catálogo">
<meta property="og:description" content="Toque em “Quero esta” na opção que você gostar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{--navy:#222757;--teal:#13998a;--green:#8cc63f;--green-d:#76ad2c;--orange:#f28c28;--blue:#2ea8dc;--sky:#9dc8ee;--pink:#fbb8b0;--ink:#3d4166;--muted:#6b6f8c;--line:#ebebf2;--soft:#f4f7fb}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--navy);font-family:Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  a{color:var(--teal)}
  button{font:inherit}
  button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .topo{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 var(--line)}
  .topo-in{display:grid;grid-template-columns:minmax(120px,1fr) auto minmax(120px,1fr);align-items:center;gap:16px;padding:10px 32px}
  #marca{justify-self:start}
  .logo{height:64px;width:auto;display:block;flex:none}
  .marca{font-size:22px;font-weight:900}
  @media (max-width:1100px){.esp{display:none}}
  .menu{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;max-width:1100px}
  .menu::-webkit-scrollbar{display:none}
  .burger{display:none;align-items:center;gap:10px;min-height:44px;max-width:62vw;padding:0 6px 0 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--navy);font-size:15px;font-weight:800;cursor:pointer}
  .burger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .burger i{position:relative;flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy)}
  .burger i:before,.burger i:after,.burger b{content:"";position:absolute;left:9px;width:14px;height:2px;border-radius:2px;background:#fff;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .burger i:before{top:11px}.burger b{top:15px}.burger i:after{top:19px}
  .topo.aberto .burger i:before{transform:translateY(4px) rotate(45deg)}
  .topo.aberto .burger b{opacity:0}
  .topo.aberto .burger i:after{transform:translateY(-4px) rotate(-45deg)}
  .veu{display:none;position:fixed;left:0;right:0;bottom:0;top:var(--topo-h,64px);z-index:4;background:rgba(13,16,48,.4);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
  .menu button{position:relative;flex:none;cursor:pointer;min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--ink);font-size:15px;font-weight:800;white-space:nowrap;transition:color .2s}
  .menu button:after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:3px;border-radius:3px;background:var(--teal);transform:scaleX(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .menu button:hover{color:var(--navy)}
  .menu button:hover:after{transform:scaleX(.4)}
  .menu button.on{color:var(--navy)}
  .menu button.on:after{transform:scaleX(1)}
  .faixa{display:grid;grid-template-columns:repeat(6,1fr);height:5px}
  .hero{background:var(--soft);padding:36px 20px 32px;text-align:center}
  .hero h1{margin:0;font-size:34px;line-height:1.1;font-weight:900}
  .hero p{margin:10px auto 0;max-width:520px;font-size:16px;line-height:1.5;color:var(--ink);text-wrap:pretty}
  .chip{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 16px;border-radius:999px;background:#fff;font-size:14px;font-weight:800;color:var(--navy)}
  .chip i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--green)}
  main{max-width:1480px;margin:0 auto;padding:28px 32px 32px}
  .lgpd{max-width:640px;margin:0 auto;padding:8px 20px 140px;font-size:13px;line-height:1.55;color:var(--muted)}
  .lgpd-box{border-radius:16px;background:var(--soft)}
  .lgpd-btn{cursor:pointer;width:100%;min-height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border:0;border-radius:16px;background:transparent;color:var(--ink);font-size:14px;font-weight:700;text-align:left}
  .lgpd-btn:hover{background:#eaf0f7}
  .lgpd-btn svg{flex:none;color:var(--teal)}
  .lgpd-btn .seta{margin-left:auto;width:24px;height:24px}
  .lgpd.aberto .lgpd-btn .seta{transform:rotate(180deg)}
  .lgpd .gaveta-in>div{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px;opacity:0;transition:opacity .35s ease}
  .lgpd.aberto .gaveta{grid-template-rows:1fr}
  .lgpd.aberto .gaveta-in>div{opacity:1;transition-delay:.08s}
  .lgpd ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .lgpd li{display:flex;gap:8px;color:var(--ink);text-wrap:pretty}
  .lgpd li:before{content:"";flex:none;width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--teal)}
  .lgpd-links{display:flex;flex-wrap:wrap;gap:6px 16px}
  .lgpd a{color:var(--navy);font-weight:800}
  .lgpd-rod{margin:12px 0 0;text-align:center;font-size:12px}
  .info{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;font-size:15px;color:var(--muted)}
  .info strong{white-space:nowrap;color:var(--navy);font-size:20px;font-weight:900}
  .grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 24px;align-items:start}
  @media (max-width:1280px){.grade{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .kit{display:flex;flex-direction:column;gap:12px}
  .foto{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--soft)}
  .foto img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .ampliar{position:absolute;inset:0;cursor:zoom-in;border:0;padding:0;background:transparent}
  .ampliar span{position:absolute;right:12px;bottom:12px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.92);color:var(--navy);box-shadow:0 2px 10px rgba(34,39,87,.18);opacity:0;transform:scale(.85);transition:opacity .25s,transform .25s}
  .kit:hover .ampliar span,.ampliar:focus-visible span{opacity:1;transform:none}
  @media (hover:none){.ampliar span{opacity:1;transform:none}}
  #zoom{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:64px 20px 24px;background:rgba(13,16,48,.88);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
  #zoom.on{opacity:1;visibility:visible;transition:opacity .3s}
  #zoom figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:min(960px,100%);max-height:100%;transform:scale(.94);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  #zoom.on figure{transform:none}
  #zoom img{display:block;max-width:100%;max-height:calc(100vh - 140px);border-radius:16px;object-fit:contain;background:#fff}
  #zoom figcaption{color:#fff;font-size:17px;font-weight:900;text-align:center}
  #zoom-x{position:absolute;top:14px;right:14px;width:48px;height:48px;display:grid;place-items:center;cursor:pointer;border:0;border-radius:50%;background:#fff;color:var(--navy);box-shadow:0 4px 16px rgba(0,0,0,.25)}
  #zoom-x:hover{background:var(--soft)}
  .kit:hover .foto img{transform:scale(1.03)}
  .selo{white-space:nowrap;position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;font-weight:800}
  .selo.escolha{left:auto;right:12px;background:var(--orange);color:var(--navy)}
  .kit.escolhido .foto{box-shadow:0 0 0 3px var(--orange)}
  .cat{font-size:13px;font-weight:700;color:var(--muted)}
  .kit h2{margin:-6px 0 0;font-size:20px;line-height:1.2;font-weight:900}
  .desc{margin:0;font-size:14px;line-height:1.5;color:var(--ink);text-wrap:pretty}
  .valores{margin-top:auto;padding-top:4px;border-radius:16px;background:var(--soft);transition:box-shadow .3s}
  .kit.aberto .valores{box-shadow:0 0 0 2px var(--line)}
  .abrir{cursor:pointer;width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border:0;border-radius:16px;background:transparent;color:var(--navy);text-align:left}
  .abrir:hover{background:#eaf0f7}
  .abrir b{font-size:16px;font-weight:900;white-space:nowrap}
  .abrir small{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
  .abrir small em{font-style:normal;font-size:18px;font-weight:900;color:var(--teal)}
  .seta{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#fff;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .kit.aberto .seta{transform:rotate(180deg)}
  .gaveta{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}
  .kit.aberto .gaveta{grid-template-rows:1fr}
  .gaveta-in{min-height:0;overflow:hidden}
  .opcoes{display:flex;flex-direction:column;gap:10px;padding:0 10px 10px;opacity:0;transform:translateY(-8px);transition:opacity .35s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
  .kit.aberto .opcoes{opacity:1;transform:none;transition-delay:.08s}
  .op{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:#fff}
  .como{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:14px;line-height:1.45;color:var(--ink);text-wrap:pretty}
  .como svg{flex:none;margin-top:1px;color:var(--teal)}
  .como strong{color:var(--navy)}
  .quando{display:flex;flex-direction:column;gap:8px;margin-top:18px;max-width:520px}
  .quando label{font-size:14px;font-weight:800;color:var(--navy)}
  .quando div{display:flex;gap:8px;flex-wrap:wrap}
  .quando input,.res-data input{flex:1;min-width:180px;min-height:48px;padding:0 14px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
  .quando input:focus,.res-data input:focus{outline:none;border-color:var(--teal)}
  .quando button{cursor:pointer;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-size:15px;font-weight:800}
  .quando small{font-size:13px;color:var(--muted)}
  #res{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(13,16,48,.6);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
  #res.on{opacity:1;visibility:visible;transition:opacity .3s}
  .res-box{position:relative;width:min(440px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;border-radius:20px;background:#fff;box-shadow:0 20px 60px rgba(13,16,48,.3);transform:translateY(16px);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  #res.on .res-box{transform:none}
  #res-in{display:flex;flex-direction:column;gap:14px}
  .res-x{position:absolute;top:12px;right:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border:0;border-radius:50%;background:var(--soft);color:var(--navy)}
  .res-kit{display:flex;gap:14px;align-items:center;padding-right:44px}
  .res-kit img{width:72px;height:72px;flex:none;border-radius:12px;object-fit:cover}
  .res-kit div{display:flex;flex-direction:column;gap:2px;min-width:0}
  .res-kit span{font-size:13px;font-weight:700;color:var(--muted)}
  .res-kit strong{font-size:19px;font-weight:900;color:var(--navy)}
  .res-kit em{font-style:normal;font-size:17px;font-weight:900;color:var(--teal)}
  .res-data{display:flex;flex-direction:column;gap:8px}
  .res-data label{font-size:15px;font-weight:800;color:var(--ink)}
  .res-bt{cursor:pointer;min-height:50px;padding:0 18px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-size:16px;font-weight:800;text-align:left}
  .res-bt:disabled{opacity:.6}
  .res-link{cursor:pointer;align-self:flex-start;min-height:40px;padding:0;border:0;background:none;color:var(--navy);font:inherit;font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:3px}
  .res-st{display:flex;gap:8px;align-items:center;margin:0;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:15px;font-weight:700;color:var(--ink);text-wrap:pretty}
  .res-st svg{flex:none}
  .res-st.ok{background:#e6f6f3;color:#0b6b60}
  .res-st.nao{background:#fdecea;color:#a02a1a}
  .res-wa{cursor:pointer;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;border:0;border-radius:14px;background:#1faa59;color:#fff;font:inherit;font-size:17px;font-weight:900;text-align:left}
  .res-wa:hover{background:#178f4a}
  .res-obs{font-size:13px;color:var(--muted);text-align:center}
  .todas{cursor:pointer;border:0;background:none;padding:0;color:var(--navy);font:inherit;font-weight:800;text-decoration:underline}
  @media (max-width:600px){#res{align-items:flex-end;padding:0}.res-box{width:100%;max-height:92vh;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}}
  @media (prefers-reduced-motion:reduce){.gaveta,.opcoes,.seta,.lgpd .gaveta-in>div,#zoom,#zoom figure,.menu button:after,.menu,.veu,.burger i:before,.burger i:after,.burger b{transition:none}}
  .op-l{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .op-l span{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
  .op-l strong{font-size:20px;font-weight:900;color:var(--teal)}
  .quero{cursor:pointer;min-height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--green);color:var(--navy);font-size:16px;font-weight:900;text-align:center}
  .quero:hover{background:var(--green-d)}
  .quero:active{transform:translateY(1px)}
  .indisp{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:999px;background:#e6e7ee;color:var(--muted);font-size:15px;font-weight:800}
  .vazio{grid-column:1/-1;margin:0;padding:40px 0;font-size:16px;color:var(--muted);text-align:center}
  #aviso{position:fixed;left:12px;right:12px;bottom:12px;display:none;max-width:560px;margin:0 auto;background:var(--navy);color:#fff;padding:16px 18px;border-radius:16px;font-size:15px;line-height:1.45;box-shadow:0 10px 30px rgba(34,39,87,.3);border-left:6px solid var(--green)}
  @media (max-width:1100px){.topo-in{grid-template-columns:auto minmax(0,1fr);padding:10px 20px}.menu{justify-content:flex-end}main{padding:28px 20px 32px}}
  @media (max-width:1060px) and (min-width:901px){.abrir{padding:0 12px;gap:8px}.abrir small i{display:none}}
  @media (max-width:900px){.grade{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){
    .topo-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px 8px 16px}
    .logo{height:46px}
    .marca{font-size:19px}
    .burger{display:flex}
    .menu{position:fixed;left:0;right:0;top:var(--topo-h,64px);z-index:6;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:0;max-width:none;max-height:calc(100vh - var(--topo-h,64px));overflow-y:auto;padding:6px 0 calc(14px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 18px 32px rgba(13,16,48,.16);opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
    .topo.aberto .menu{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1)}
    .menu button{min-height:54px;padding:0 20px;text-align:left;font-size:17px;white-space:normal;border-bottom:1px solid var(--line)}
    .menu button:last-child{border-bottom:0}
    .menu button:after{left:20px;right:auto;width:32px;bottom:9px}
    .menu button.on{color:var(--teal)}
    .veu{display:block}
    .topo.aberto .veu{opacity:1;visibility:visible;transition:opacity .25s}
    .hero{padding:24px 16px}
    .hero h1{font-size:28px}
    main{padding:20px 16px 24px}
    .grade{grid-template-columns:minmax(0,1fr);gap:32px}
  }
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div id="marca"></div>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Categorias"><span id="cat-atual">Categorias</span><i aria-hidden="true"><b></b></i></button>
    <nav class="menu" id="menu" aria-label="Categorias"></nav>
    <div class="veu" id="veu" aria-hidden="true"></div>
    <span class="esp" aria-hidden="true"></span>
  </div>
  <div class="faixa" aria-hidden="true"><span style="background:var(--sky)"></span><span style="background:var(--green)"></span><span style="background:var(--orange)"></span><span style="background:var(--blue)"></span><span style="background:var(--pink)"></span><span style="background:var(--teal)"></span></div>
</header>
<section class="hero" id="hero">
  <h1>Nossas opções</h1>
  <p>Carregando o catálogo…</p>
</section>
<main id="app"></main>
<footer class="lgpd" id="lgpd"></footer>
<div id="aviso" role="status"></div>
<div id="zoom" role="dialog" aria-modal="true" aria-label="Foto ampliada" aria-hidden="true"><button id="zoom-x" aria-label="Fechar foto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><figure><img id="zoom-img" alt=""><figcaption id="zoom-cap"></figcaption></figure></div>
<div id="res" role="dialog" aria-modal="true" aria-labelledby="res-t" aria-hidden="true"><div class="res-box"><button class="res-x" id="res-x" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><div id="res-in"></div></div></div>
<script>
(function(){
  var C=window.SF_CONFIG||{},API=(C.url||'')+'/functions/v1/catalogo';
  var q=new URLSearchParams(location.search),T=(q.get('t')||'').replace(/[^a-f0-9]/gi,''),CAT=q.get('c')||'';
  var E=(q.get('e')||'').toLowerCase().replace(/[^a-z0-9-]/g,''),PUB=T.length<20&&(!!E||!/(^|\.)clientello\.com\.br$/.test(location.hostname));
  var HOJE=new Date(Date.now()-3*3600e3).toISOString().slice(0,10),SK='cat_'+(E||location.hostname),REF='',DATA=null,ORIG=null,LIVRES=false;
  function guarda(k,v){try{v==null?sessionStorage.removeItem(SK+k):sessionStorage.setItem(SK+k,v);}catch(e){}}
  try{REF=sessionStorage.getItem(SK+'_ref')||'';DATA=sessionStorage.getItem(SK+'_data')||null;ORIG=JSON.parse(sessionStorage.getItem(SK+'_orig')||'null');}catch(e){}
  if(DATA&&DATA<HOJE)DATA=null;
  if(!ORIG){ORIG={};['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid'].forEach(function(k){var v=q.get(k);if(v)ORIG[k]=v;});if(ORIG.fbclid)ORIG.fbclid_em=Date.now();if(document.referrer)ORIG.referrer=document.referrer.split('?')[0];guarda('_orig',JSON.stringify(ORIG));}
  var app=document.getElementById('app'),aviso=document.getElementById('aviso'),menu=document.getElementById('menu'),hero=document.getElementById('hero'),marca=document.getElementById('marca');
  var D=null,filtro=null,enviando=false,abertos={},vistos={};
  var ICO={
    decoracao_completa:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>',
    pegue_monte:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/></svg>'
  };
  var COMO={
    decoracao_completa:'<strong>Nós fazemos tudo:</strong> levamos, montamos e retiramos depois. Você só aproveita a festa.',
    pegue_monte:'<strong>Você monta:</strong> retira a decoração no nosso endereço, monta e devolve depois.'
  };
  var LOGOS={'sua festa':'logo-sua-festa.png'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function brl(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:Number(v)%1?2:0,maximumFractionDigits:2});}
  function dataBR(d){var p=String(d).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
  function post(b){if(PUB){b.acao='pub_'+b.acao;b.e=E;b.host=location.hostname;b.ref=REF;b.url=location.origin+location.pathname;}else b.t=T;return fetch(API,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',apikey:C.anonKey||'',Authorization:'Bearer '+(C.anonKey||'')},body:JSON.stringify(b)}).then(function(r){return r.json();});}
  function falha(msg){hero.innerHTML='<h1>Catálogo indisponível</h1><p>'+esc(msg)+(PUB?' Tente de novo em instantes.':' Peça um novo link na conversa do WhatsApp.')+'</p>';}
  function mostrarAviso(html){aviso.innerHTML=html;aviso.style.display='block';}
  function topo(){
    var lg=D.logo||LOGOS[String(D.empresa||'').trim().toLowerCase()];
    marca.innerHTML=lg?'<img class="logo" src="'+esc(lg)+'" alt="'+esc(D.empresa)+'">':'<span class="marca">'+esc(D.empresa)+'</span>';
    var emp=esc(D.empresa||'a empresa');
    document.getElementById('lgpd').innerHTML='<div class="lgpd-box"><button class="lgpd-btn" id="lgpd-btn" aria-expanded="false">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>'+
      '<span>Seus dados protegidos · LGPD</span><span class="seta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>'+
      '<div class="gaveta"><div class="gaveta-in"><div><ul>'+
        '<li><span>Registramos quais opções você abre e escolhe'+(PUB?' e de onde você chegou (ex.: Instagram)':'')+', para '+emp+' atender o seu pedido.</span></li>'+
        '<li><span>Esses registros ajudam '+emp+' a medir os anúncios dela na Meta. Seu telefone vai criptografado e nenhuma mensagem é compartilhada.</span></li>'+
        '<li><span>Sem cookies e sem rastreio no seu navegador.</span></li>'+
        '<li><span>Não quer participar? É só avisar na conversa e paramos em até 2 dias úteis.</span></li>'+
      '</ul><div class="lgpd-links"><a href="https://app.clientello.com.br/privacidade.html#catalogo-anuncios" target="_blank" rel="noopener">Política de privacidade</a><a href="https://app.clientello.com.br/termos.html" target="_blank" rel="noopener">Termos de uso</a><a href="https://app.clientello.com.br/exclusao-de-dados.html" target="_blank" rel="noopener">Excluir meus dados</a></div></div></div></div></div>'+
      '<p class="lgpd-rod">Catálogo de '+emp+' · tecnologia Clientello</p>';
    document.getElementById('lgpd-btn').onclick=function(){var ft=document.getElementById('lgpd'),on=!ft.classList.contains('aberto');ft.classList.toggle('aberto',on);this.setAttribute('aria-expanded',on?'true':'false');};
    if(PUB){hero.innerHTML='<h1>Escolha a decoração da sua festa</h1><p>Veja as fotos e os valores, confira se a sua data está livre e reserve pelo WhatsApp.</p>'+
      '<form class="quando" id="quando"><label for="quando-d">Data da festa</label><div><input type="date" id="quando-d" min="'+HOJE+'" value="'+(D.data||'')+'"><button type="submit">'+(D.data?'Trocar data':'Ver disponibilidade')+'</button></div>'+
      (D.data?'<span class="chip"><i></i>Mostrando a disponibilidade para '+dataBR(D.data)+'</span>':'<small>Opcional: mostra o que está livre no seu dia.</small>')+'</form>';return;}
    hero.innerHTML='<h1>Nossas opções</h1><p>Veja as fotos, toque em <strong>Ver valores</strong> e escolha como prefere a sua decoração. A sua escolha vai direto para a conversa.</p>'+
      (D.data?'<span class="chip"><i></i>Disponibilidade para '+dataBR(D.data)+'</span>':'');
  }
  function render(){
    var cats=[];D.kits.forEach(function(k){if(k.categoria&&cats.indexOf(k.categoria)<0)cats.push(k.categoria);});cats.sort();
    var m='';if(cats.length>1)[null].concat(cats).forEach(function(c){m+='<button class="'+(filtro===c?'on':'')+'" data-cat="'+esc(c==null?'':c)+'">'+esc(c==null?'Todas':c)+'</button>';});
    menu.innerHTML=m;
    var on=menu.querySelector('.on');if(on&&menu.scrollWidth>menu.clientWidth){menu.style.scrollBehavior='auto';menu.scrollLeft=Math.max(0,on.offsetLeft-menu.offsetLeft-(menu.clientWidth-on.offsetWidth)/2);menu.style.scrollBehavior='';}
    fimMenu();
    catAtual.textContent=filtro||'Todas as festas';burger.style.visibility=m?'':'hidden';
    var lista=D.kits.filter(function(k){return (!filtro||k.categoria===filtro)&&(!LIVRES||!D.data||k.opcoes.some(function(o){return o.livre;}));});
    var h='<div class="info"><strong>'+esc(filtro||'Todas as opções')+'</strong><span>'+(LIVRES&&D.data?'Livres em '+dataBR(D.data)+' · <button class="todas" data-todas="1">ver todas</button> · ':'')+lista.length+(lista.length===1?' opção':' opções')+'</span></div><section class="grade">';
    if(!lista.length)h+='<p class="vazio">Nenhuma opção nesta categoria.</p>';
    lista.forEach(function(k){
      var aberto=abertos[k.id]!=null?abertos[k.id]:!!k.escolhido,min=Math.min.apply(null,k.opcoes.map(function(o){return Number(o.preco)||0;}));
      h+='<article class="kit'+(k.escolhido?' escolhido':'')+(aberto?' aberto':'')+'">'+
        '<div class="foto">'+(k.foto?'<img src="'+esc(k.foto)+'" alt="'+esc(k.nome)+'" loading="lazy"><button class="ampliar" data-zoom="'+esc(k.foto)+'" data-nome="'+esc(k.nome)+'" aria-label="Ampliar foto de '+esc(k.nome)+'"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></span></button>':'')+
          (k.categoria&&!filtro?'<span class="selo">'+esc(k.categoria)+'</span>':'')+
          (k.escolhido?'<span class="selo escolha">Sua escolha</span>':'')+'</div>'+
        (k.categoria&&filtro?'<span class="cat">'+esc(k.categoria)+'</span>':'')+
        '<h2>'+esc(k.nome)+'</h2>'+
        (k.descricao?'<p class="desc">'+esc(k.descricao)+'</p>':'');
      h+='<div class="valores"><button class="abrir" data-abrir="'+esc(k.id)+'" aria-expanded="'+(aberto?'true':'false')+'">'+
          '<b>Ver valores</b><small>'+(k.opcoes.length>1?'<i style="font-style:normal">a partir de </i>':'')+'<em>'+brl(min)+'</em></small>'+
          '<span class="seta"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>'+
        '<div class="gaveta"><div class="gaveta-in"><div class="opcoes">';
      k.opcoes.forEach(function(o){
        h+='<div class="op"><div class="op-l"><span>'+esc(o.nome)+'</span><strong>'+brl(o.preco)+'</strong></div>'+
          (COMO[o.modalidade]?'<p class="como">'+ICO[o.modalidade]+'<span>'+COMO[o.modalidade]+'</span></p>':'')+
          (o.livre?'<button class="quero" data-kit="'+esc(k.id)+'" data-mod="'+esc(o.modalidade)+'">Quero esta</button>'
                  :'<span class="indisp">Indisponível nessa data</span>')+'</div>';
      });
      h+='</div></div></div></div></article>';
    });
    app.innerHTML=h+'</section>';
  }
  function fimMenu(){menu.classList.toggle('fim',menu.scrollLeft+menu.clientWidth>=menu.scrollWidth-4);}
  menu.addEventListener('scroll',fimMenu,{passive:true});
  var topoEl=document.querySelector('.topo');
  var burger=document.getElementById('burger'),catAtual=document.getElementById('cat-atual');
  function abrirMenu(v){if(v){topoEl.style.setProperty('--topo-h',Math.round(topoEl.getBoundingClientRect().bottom)+'px');}topoEl.classList.toggle('aberto',v);burger.setAttribute('aria-expanded',v?'true':'false');document.body.style.overflow=v?'hidden':'';}
  burger.addEventListener('click',function(){abrirMenu(!topoEl.classList.contains('aberto'));});
  document.getElementById('veu').addEventListener('click',function(){abrirMenu(false);});
  window.addEventListener('resize',function(){if(window.innerWidth>640&&topoEl.classList.contains('aberto'))abrirMenu(false);});
  menu.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    filtro=b.getAttribute('data-cat')||null;if(topoEl.classList.contains('aberto'))abrirMenu(false);render();window.scrollTo(0,0);
  });
  var zoom=document.getElementById('zoom'),zImg=document.getElementById('zoom-img'),zCap=document.getElementById('zoom-cap'),zVolta=null;
  function abrirZoom(src,nome,de){zImg.src=src;zImg.alt=nome;zCap.textContent=nome;zVolta=de;zoom.classList.add('on');zoom.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('zoom-x').focus();}
  function fecharZoom(){if(!zoom.classList.contains('on'))return;zoom.classList.remove('on');zoom.setAttribute('aria-hidden','true');document.body.style.overflow='';if(zVolta)zVolta.focus();}
  zoom.addEventListener('click',function(e){if(e.target===zoom||e.target.closest('#zoom-x'))fecharZoom();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){fecharZoom();fecharRes();if(topoEl.classList.contains('aberto')){abrirMenu(false);burger.focus();}}});
  hero.addEventListener('submit',function(e){e.preventDefault();var v=(document.getElementById('quando-d')||{}).value;if(v)carregar(v);});
  var res=document.getElementById('res'),resIn=document.getElementById('res-in'),RS=null;
  function fecharRes(){if(!RS)return;res.classList.remove('on');res.setAttribute('aria-hidden','true');document.body.style.overflow='';RS=null;}
  function abrirReserva(id,mod){RS={id:id,mod:mod};res.classList.add('on');res.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';passoRes();}
  function passoRes(){
    var k=D.kits.filter(function(x){return x.id===RS.id;})[0],o=k&&k.opcoes.filter(function(x){return x.modalidade===RS.mod;})[0];
    if(!k||!o){fecharRes();return;}
    var h='<div class="res-kit">'+(k.foto?'<img src="'+esc(k.foto)+'" alt="">':'')+'<div><span>'+esc(o.nome)+'</span><strong id="res-t">'+esc(k.nome)+'</strong><em>'+brl(o.preco)+'</em></div></div>';
    if((!D.data&&!RS.semData)||RS.trocar){
      h+='<form class="res-data" id="res-f"><label for="res-d">Para qual data é a festa?</label><input type="date" id="res-d" min="'+HOJE+'" value="'+(D.data||'')+'" required><button type="submit" class="res-bt">Ver se está livre</button></form>'+(RS.trocar?'':'<button class="res-link" id="res-sem">Ainda não sei a data</button>');
    }else if(D.data&&!o.livre){
      var outra=k.opcoes.filter(function(y){return y.modalidade!==o.modalidade&&y.livre;})[0];
      h+='<p class="res-st nao">Esse kit já está reservado para '+dataBR(D.data)+'.</p>'+
        (outra?'<button class="res-bt" data-outra="'+esc(outra.modalidade)+'">Ver '+esc(outra.nome)+' · '+brl(outra.preco)+' (livre)</button>':'')+
        '<button class="res-link" id="res-livres">Ver opções livres nessa data</button><button class="res-link" id="res-trocar">Trocar a data</button>';
    }else{
      h+=(D.data?'<p class="res-st ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Livre para '+dataBR(D.data)+'</span></p>':'<p class="res-st">Sem data por enquanto: a equipe confere a disponibilidade com você.</p>')+
        (COMO[o.modalidade]?'<p class="como">'+ICO[o.modalidade]+'<span>'+COMO[o.modalidade]+'</span></p>':'')+
        '<button class="res-wa" id="res-wa"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span>Reservar pelo WhatsApp</span></button><small class="res-obs">Abre o WhatsApp com a sua escolha. É só enviar a mensagem.</small>';
    }
    resIn.innerHTML=h;
    var di=document.getElementById('res-d');if(di)setTimeout(function(){di.focus();},60);
  }
  res.addEventListener('click',function(e){
    if(e.target===res||e.target.closest('#res-x')){fecharRes();return;}
    if(!RS)return;
    if(e.target.closest('#res-sem')){RS.semData=true;passoRes();return;}
    if(e.target.closest('#res-trocar')){RS.trocar=true;passoRes();return;}
    if(e.target.closest('#res-livres')){LIVRES=true;fecharRes();render();window.scrollTo(0,0);return;}
    var ot=e.target.closest('button[data-outra]');if(ot){RS.mod=ot.getAttribute('data-outra');passoRes();return;}
    var wa=e.target.closest('#res-wa');if(wa&&!enviando)reservar(wa);
  });
  res.addEventListener('submit',function(e){
    e.preventDefault();var v=document.getElementById('res-d').value;if(!v||!RS)return;
    var bt=res.querySelector('.res-bt');if(bt){bt.disabled=true;bt.textContent='Conferindo…';}
    RS.trocar=false;RS.semData=false;carregar(v,function(){if(RS)passoRes();});
  });
  function reservar(bt){
    var sp=bt.querySelector('span');enviando=true;sp.textContent='Abrindo o WhatsApp…';
    post({acao:'reservar',produto_id:RS.id,modalidade:RS.mod,data:D.data||undefined}).then(function(r){
      enviando=false;
      if(r.indisponivel){carregar(D.data,function(){if(RS)passoRes();});return;}
      if(r.erro||!r.url){sp.textContent='Reservar pelo WhatsApp';mostrarAviso(esc(r.erro||'Não conseguimos abrir o WhatsApp.'));return;}
      location.href=r.url;setTimeout(function(){sp.textContent='Reservar pelo WhatsApp';},2500);
    }).catch(function(){enviando=false;sp.textContent='Reservar pelo WhatsApp';mostrarAviso('Não conseguimos abrir o WhatsApp agora. Tente de novo.');});
  }

  app.addEventListener('click',function(e){
    if(e.target.closest('[data-todas]')){LIVRES=false;render();return;}
    var z=e.target.closest('button[data-zoom]');
    if(z){abrirZoom(z.getAttribute('data-zoom'),z.getAttribute('data-nome'),z);return;}
    var a=e.target.closest('button[data-abrir]');
    if(a){var id0=a.getAttribute('data-abrir'),art=a.closest('.kit'),on=!art.classList.contains('aberto');
      art.classList.toggle('aberto',on);a.setAttribute('aria-expanded',on?'true':'false');abertos[id0]=on;if(on&&!vistos[id0]){vistos[id0]=1;post({acao:'ver_kit',produto_id:id0}).catch(function(){});}return;}
    var b=e.target.closest('button[data-kit]');if(!b||enviando)return;
    if(PUB){abrirReserva(b.getAttribute('data-kit'),b.getAttribute('data-mod'));return;}
    enviando=true;b.textContent='Enviando…';
    var id=b.getAttribute('data-kit'),mod=b.getAttribute('data-mod');
    post({acao:'escolher',produto_id:id,modalidade:mod}).then(function(r){
      enviando=false;
      if(r.erro){b.textContent='Quero esta';mostrarAviso(esc(r.erro));return;}
      D.kits.forEach(function(k){k.escolhido=k.id===id;});render();
      var k=D.kits.filter(function(x){return x.id===id;})[0];
      mostrarAviso('<strong>Pronto! Enviamos sua escolha: '+esc(k?k.nome:'')+'.</strong><br>Pode voltar para o WhatsApp, a gente continua por lá.');
    }).catch(function(){enviando=false;b.textContent='Quero esta';mostrarAviso('Não conseguimos enviar agora. Tente de novo em instantes.');});
  });
  function carregar(data,depois){
    return post({acao:'ver',c:CAT,data:data||undefined,origem:ORIG}).then(function(r){
      if(r.erro){if(!D)falha(r.erro+'.');else mostrarAviso(esc(r.erro));return;}
      var primeira=!D;D=r;
      if(r.ref){REF=r.ref;guarda('_ref',r.ref);}
      if(PUB){DATA=r.data||null;guarda('_data',DATA);}
      document.title='Catálogo · '+r.empresa;
      if(primeira&&CAT){var lc=CAT.toLowerCase();D.kits.forEach(function(k){if(k.categoria&&k.categoria.toLowerCase()===lc)filtro=k.categoria;});}
      topo();render();if(depois)depois();
    }).catch(function(){if(!D)falha('Não conseguimos abrir o catálogo agora.');else mostrarAviso('Não conseguimos atualizar agora. Tente de novo.');});
  }
  if((!PUB&&T.length<20)||!C.url){falha('Este link está incompleto.');return;}
  carregar(PUB?DATA:null);
})();
</script>

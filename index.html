document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);   --color-text: #eceefb;\n  --color-divider: #2c3162;\n  --color-neutral-100: #1b1f40; --color-neutral-200: #272c54; --color-neutral-300: #363b66;\n  --color-neutral-400: #4b517a; --color-neutral-500: #686e94; --color-neutral-600: #8a90b2;\n  --color-neutral-700: #a8adca; --color-neutral-800: #c8cbe0; --color-neutral-900: #e4e6f3;\n  --sb-bg: #0b0e24;\n  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);\n  --shadow-md: 0 6px 16px rgba(0,0,0,.4);\n  --shadow-lg: 0 18px 40px rgba(0,0,0,.5);\n  color-scheme: dark;\n}\n.sf[data-accent=\"azul\"] { --acc: #1f8fc4; }\n.sf[data-accent=\"vermelho\"] { --acc: #e01e2b; }\n.sf[data-accent=\"laranja\"] { --acc: #de6c14; }\n\n.sf, .sf * { scrollbar-width: thin; scrollbar-color: var(--color-neutral-300) transparent; }\n.sf h1, .sf h2, .sf h3, .sf h4, .sf h5 { font-family: var(--font-heading); letter-spacing: -0.02em; }\n.sf .btn { border-radius: 10px; font-weight: 700; padding: 9px 14px; font-size: 14px; }\n.sf .btn-primary { background: var(--color-accent); color: var(--on-accent); box-shadow: 0 4px 12px color-mix(in srgb, var(--acc) 30%, transparent); }\n.sf .btn-primary:hover { background: var(--color-accent-600); }\n.sf .btn-secondary { background: var(--card); border-color: var(--color-divider); color: var(--color-text); }\n.sf .btn-secondary:hover { background: var(--color-surface); }\n.sf .btn-ghost { color: var(--color-accent-700); padding-inline: 10px; }\n.sf .input { background: var(--card); border: 1px solid var(--color-divider); border-radius: 10px; color: var(--color-text); min-height: 40px; padding: 8px 12px; }\n.sf .input::placeholder { color: var(--color-neutral-600); }\n.sf .input:focus-visible { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-100); outline: none; }\n.sf .tag { border-radius: 999px; font-weight: 600; }\n.sf .tag-neutral { background: var(--color-surface); color: var(--color-neutral-800); }\n.sf .field > label { color: var(--color-neutral-700); font-weight: 600; }\n\n.sf aside::-webkit-scrollbar { display: none; }\n<\u002Fstyle>\n<script src=\"6cee4b18-4741-4216-ab51-18a056189116\"><\u002Fscript>\n<script src=\"f5cc0d1d-0d07-4148-bda2-897c3fd0041d\"><\u002Fscript>\n<style>html,body{margin:0;height:100%;} a{color:var(--color-accent-700);} a:hover{color:var(--color-accent);}<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"sf\" data-theme=\"{{ sf }}\" data-accent=\"{{ acc }}\" style=\"height:100vh; display:flex; background:var(--color-bg); color:var(--color-text); overflow:hidden;\">\n<sc-if value=\"{{ isGate }}\">\n<div style=\"flex:1; height:100%; overflow-y:auto; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--sb-bg);\">\n  <div style=\"width:min(460px, 100%); display:flex; flex-direction:column; gap:18px;\">\n    <div style=\"display:flex; justify-content:center; padding:18px 24px; border-radius:18px; background:#fff;\"><img src=\"80f03efa-2a70-40d0-bb08-126df6382ce6\" alt=\"Clientello · Atenda melhor. Venda mais.\" style=\"width:100%; max-width:340px; height:auto; display:block;\"><\u002Fdiv>\n    <div style=\"background:var(--card); border:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-sm); padding:26px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow-lg);\">\n      <sc-if value=\"{{ isCarregando }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex; flex-direction:column; gap:6px;\"><strong style=\"font-size:18px;\">Carregando…<\u002Fstrong><span style=\"font-size:13px; color:var(--color-neutral-700);\">Conectando ao banco de dados.<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ isErroFase }}\">\n        <strong style=\"font-size:18px;\">Não foi possível abrir o sistema<\u002Fstrong>\n        <sc-if value=\"{{ hasErro }}\"><div style=\"display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:10px; background:color-mix(in srgb, var(--brand-red) 10%, var(--card)); color:var(--brand-red); font-size:13px; font-weight:600;\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" x2=\"12\" y1=\"8\" y2=\"12\"><\u002Fline><line x1=\"12\" x2=\"12.01\" y1=\"16\" y2=\"16\"><\u002Fline><\u002Fsvg><span style=\"flex:1;\">{{ erro }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap;\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ tentarDeNovo }}\">Tentar de novo<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ voltarConfig }}\">Trocar conexão<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isConfigFase }}\">\n        <div><h2 style=\"margin:0; font-size:22px;\">Conectar ao banco de dados<\u002Fh2><span style=\"font-size:13px; color:var(--color-neutral-700);\">Cole a Project URL e a chave anon public do Supabase (Project Settings › API). Em produção, elas ficam no arquivo config.js.<\u002Fspan><\u002Fdiv>\n        <div class=\"field\"><label>Project URL<\u002Flabel><input class=\"input\" placeholder=\"https://xxxxxxxx.supabase.co\" value=\"{{ af.url }}\" sc-camel-on-change=\"{{ onAf_url }}\"><\u002Fdiv>\n        <div class=\"field\"><label>Chave anon public<\u002Flabel><input class=\"input\" placeholder=\"eyJhbGciOi…\" value=\"{{ af.key }}\" sc-camel-on-change=\"{{ onAf_key }}\"><\u002Fdiv>\n        <sc-if value=\"{{ hasErro }}\"><div style=\"display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:10px; background:color-mix(in srgb, var(--brand-red) 10%, var(--card)); color:var(--brand-red); font-size:13px; font-weight:600;\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" x2=\"12\" y1=\"8\" y2=\"12\"><\u002Fline><line x1=\"12\" x2=\"12.01\" y1=\"16\" y2=\"16\"><\u002Fline><\u002Fsvg><span style=\"flex:1;\">{{ erro }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ salvarConexao }}\" style=\"justify-content:flex-start;\">Conectar<\u002Fbutton>\n        <div style=\"display:flex; align-items:center; gap:10px; font-size:13px; color:var(--color-neutral-700);\"><span style=\"flex:1; height:1px; background:var(--color-divider);\"><\u002Fspan>ou<span style=\"flex:1; height:1px; background:var(--color-divider);\"><\u002Fspan><\u002Fdiv>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ usarDemo }}\" style=\"justify-content:flex-start;\">Testar com dados de demonstração<\u002Fbutton>\n        <span style=\"font-size:12px; color:var(--color-neutral-700);\">Na demonstração, tudo funciona com dados de exemplo salvos só neste navegador. Nenhuma mensagem real é enviada.<\u002Fspan>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isLogin }}\">\n        <sc-if value=\"{{ mostrarTabs }}\"><div style=\"display:flex; flex-wrap:wrap; padding:4px; gap:4px; background:var(--color-surface); border-radius:12px;\"><sc-for list=\"{{ authTabs }}\" as=\"t\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ t.onClick }}\" style=\"all:unset; cursor:pointer; flex:1; text-align:left; padding:8px 12px; border-radius:9px; font-size:13px; font-weight:600; white-space:nowrap; background:{{ t.bg }}; color:{{ t.color }}; box-shadow:{{ t.shadow }};\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n        <h2 style=\"margin:0; font-size:22px;\">{{ authTitulo }}<\u002Fh2>\n        <div class=\"field\"><label>E-mail<\u002Flabel><input class=\"input\" type=\"email\" placeholder=\"voce@empresa.com.br\" value=\"{{ af.email }}\" sc-camel-on-change=\"{{ onAf_email }}\" sc-camel-on-key-down=\"{{ authKey }}\"><\u002Fdiv>\n        <sc-if value=\"{{ naoRecuperar }}\"><div class=\"field\">< Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ isConfig }}\">\n<div data-screen-label=\"Configurações\" style=\"flex:1; overflow-y:auto; padding:28px 32px 36px; display:flex; flex-direction:column; gap:16px;\">\n  <div><span style=\"font-size:13px; font-weight:600; color:var(--color-accent-700);\">{{ empresaNome }}<\u002Fspan><h1 style=\"margin:2px 0 0; font-size:30px; font-weight:800; letter-spacing:-.025em;\">Configurações<\u002Fh1><\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:4px; padding:4px; background:var(--color-surface); border-radius:12px; align-self:flex-start; max-width:100%;\"><sc-for list=\"{{ cfgTabs }}\" as=\"tb\" hint-placeholder-count=\"6\"><button sc-camel-on-click=\"{{ tb.onClick }}\" style=\"all:unset; cursor:pointer; padding:8px 14px; border-radius:9px; font-size:13px; font-weight:600; white-space:nowrap; background:{{ tb.bg }}; color:{{ tb.color }}; box-shadow:{{ tb.shadow }};\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n\n  <sc-if value=\"{{ tGeral }}\">\n    <section style=\"background:var(--card); border:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-sm); padding:22px 24px; display:flex; flex-direction:column;\"><div style=\"margin-bottom:6px;\"><h3 style=\"margin:0; font-size:17px;\">Empresa e Pix<\u002Fh3><span style=\"font-size:13px; color:var(--color-neutral-700);\">A chave Pix vai na mensagem do sinal. Você confere o pagamento no extrato.<\u002Fspan><\u002Fdiv><div style=\"display:flex; flex-direction:column; gap:14px; padding-top:8px;\"><div style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px;\"><div class=\"field\"><label>Nome da empresa<\u002Flabel><input class=\"input\" placeholder=\"Sua Festa\" value=\"{{ cf.nome }}\" sc-camel-on-change=\"{{ on_cf_nome }}\"><\u002Fdiv><div class=\"field\"><label>Cidade<\u002Flabel><input class=\"input\" placeholder=\"São Paulo\" value=\"{{ cf.cidade }}\" sc-camel-on-change=\"{{ on_cf_cidade }}\"><\u002Fdiv><\u002Fdiv><d int-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ t.onClick }}\" style=\"all:unset; cursor:pointer; flex:1; text-align:left; padding:8px 12px; border-radius:9px; font-size:13px; font-weight:600; white-space:nowrap; background:{{ t.bg }}; color:{{ t.color }}; box-shadow:{{ t.shadow }};\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex; gap:16px; align-items:center; padding:14px 0; border-bottom:1px solid var(--color-divider); flex-wrap:wrap;\"><div style=\"flex:1; min-width:240px; display:flex; flex-direction:column; gap:2px;\"><strong style=\"font-size:14px;\">Atribuir na primeira resposta<\u002Fstrong><span style=\"font-size:13px; color:var(--color-neutral-700);\">Conversa sem responsável passa a ser de quem responder primeiro.<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ cfgPrimeira.toggle }}\" style=\"all:unset; cursor:pointer; position:relative; width:40px; height:24px; flex:none; border-radius:999px; background:{{ cfgPrimeira.track }};\"><span style=\"position:absolute; top:3px; left:{{ cfgPrimeira.knob }}; width:18px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tUsuarios }}\">\n    <section style=\"background:var(--card); border:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-sm); padding:22px 24px; display:flex; gap:16px; align-items:center; flex-wrap:wrap;\"><div style=\"flex:1; min-width:200px;\"><span style=\"font-size:13px; color:var(--color-neutral-700);\">Assentos da organização<\u002Fspan><div style=\"display:flex; align-items:baseline; gap:6px;\"><strong style=\"font-size:34px; font-weight:800;\">{{ seatUsados }}<\u002Fstrong><span style=\"font-size:18px; color:var(--color-neutral-700);\">/ {{ seatTotal }}<\u002Fspan><\u002Fdiv><span style=\"font-size:13px; color:var(--color-neutral-700);\">{{ seatLivres }}<\u002Fspan><\u002Fdiv><sc-if value=\"{{ podeConvida 8px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:8px; padding-top:6px;\"><strong style=\"font-size:15px;\">Redefinir senha do proprietário<\u002Fstrong><div style=\"display:flex; gap:8px; flex-wrap:wrap;\"><input class=\"input\" placeholder=\"Nova senha\" value=\"{{ fe.senha }}\" sc-camel-on-change=\"{{ fe.on_senha }}\" style=\"flex:1; min-width:180px;\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ fe.gerar }}\">Gerar<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ fe.redefinir }}\">Redefinir<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex; justify-content:flex-end;\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ fe.salvar }}\">Salvar alterações<\u002Fbutton><\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ od.tIa }}\">\n  <sc-if value=\"{{ od.carregando }}\"><p style=\"margin:0; font-size:13px; color:var(--color-neutral-700);\">Carregando configuração da IA…<\u002Fp><\u002Fsc-if>\n  <sc-if value=\"{{ od.pronto }}\">\n  <section style=\"background:var(--card); border:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-sm); padding:20px 24px; display:flex; flex-direction:column; gap:14px;\">\n    <div style=\"display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap;\">\n      <div style=\"flex:1; min-width:200px; display:flex; flex-direction:column; gap:10px;\"><h3 style=\"margin:0; font-size:17px;\">Saldo de tokens<\u002Fh3>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap;\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ od.abrirTk }}\">+ Gerenciar tokens<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ od.abrirHist }}\">{{ od.histLabel }}<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; align-items:flex-end; gap:2px;\"><span style=\"font-size:12px; color:var(--color-neutral-700);\">Tokens disponíveis<\u002Fspan><strong style=\"font-size:30px; font-weight:800; letter-spacing:-.02em; font-family:ui-monospace, monospace; color:{{ od.saldoCor }};\">{{ od.saldo }}<\u002Fstrong><sc-if value=\"{{ od.negativo }}\"><span style=\"font-size:12px; font-weight:700; color:var(--brand-red);\">Saldo negativo: a IA continua, cobre na próxima recarga<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ od.tkAberto }}\"><div style=\"display:grid; grid-template-columns:160px minmax(0,1fr) auto auto; gap:8px; align-items:end; padding:14px; border-radius:14px; background:var(--color-surface);\"><div class=\"field\"><label>Quantidade<\u002Flabel><input class=\"input\" sc-camel-input-mode=\"numeric\" placeholder=\"100000\" value=\"{{ od.tkQtd }}\" sc-camel-on-change=\"{{ od.on_tkQtd }}\"><\u002Fdiv><div class=\"field\"><label>Motivo<\u002Flabel><input class=\"input\" placeholder=\"Ex.: Pacote mensal outubro\" value=\"{{ od.tkMotivo }}\" sc-camel-on-change=\"{{ od.on_tkMotivo }}\"><\u002Fdiv><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ od.tkAdd }}\">Adicionar<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ od.tkRem }}\">Remover<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ od.histAberto }}\"><div style=\"border-top:1px solid var(--color-divider); overflow-x:auto;\"><div style=\"min-width:560px;\">\n      <div style=\"display:grid; grid-template-columns:130px 90px 120px 120px minmax(0,1fr); gap:12px; padding:10px 0; font-size:12px; font-weight:700; color:var(--color-neutral-700); border-bottom:1px solid var(--color-divider);\"><span>Data<\u002Fspan><span>Tipo<\u002Fspan><span style=\"text-align:right;\">Quantidade<\u002Fspan><span style=\"text-align:right;\">Saldo<\u002Fspan><span>Descrição<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ od.hist }}\" as=\"h\" hint-placeholder-count=\"4\"><div style=\"display:grid; grid-template-columns:130px 90px 120px 120px minmax(0,1fr); gap:12px; padding:9px 0; font-size:13px; border-bottom:1px solid var(--color-divider);\"><span style=\"color:var(--color-neutral-700);\">{{ h.data }}<\u002Fspan><span>{{ h.tipo }}<\u002Fspan><strong style=\"text-align:right; font-family:ui-monospace, monospace; color:{{ h.cor }};\">{{ h.qtd }}<\u002Fstrong><span style=\"text-align:right; font-family:ui-monospace, monospace;\">{{ h.saldo }}<\u002Fspan><span style=\"overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ h.desc }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <sc-if value=\"{{ od.semHist }}\"><p style=\"margin:10px 0 0; font-size:13px; color:var(--color-neutral-700);\">Nenhuma movimentação ainda.<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n  <\u002Fsection>\n\n  <section style=\"background:var(--card); border:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-sm); padding:20px 24px; display:flex; flex-direction:column;\">\n    <div style=\"display:flex; flex-direction:column; gap:2px; margin-bottom:4px;\"><h3 style=\"margin:0; font-size:17px;\">Configuração de IA<\u002Fh3><\u002Fdiv>\n    <div style=\"display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--color-divider);\"><div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;\"><strong style=\"font-size:14px;\">IA ativada<\u002Fstrong><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">Ativar o assistente de IA para esta organização<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ od.tAtivo.toggle }}\" style=\"all:unset; cursor:pointer; position:relative; width:40px; height:24px; flex:none; border-radius:999px; background:{{ od.tAtivo.track }};\"><span style=\"position:absolute; top:3px; left:{{ od.tAtivo.knob }}; width:18px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:6px; padding:14px 0; border-bottom:1px solid var(--color-divider);\"><strong style=\"font-size:14px;\">Modelo de IA<\u002Fstrong><sc-raw-select class=\"input\" value=\"{{ od.modelo }}\" sc-camel-on-change=\"{{ od.on_modelo }}\" style=\"max-width:360px;\"><sc-for list=\"{{ od.modelos }}\" as=\"m\" hint-placeholder-count=\"3\"><option value=\"{{ m.id }}\">{{ m.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><span style=\"font-size:12px; color:var(--color-neutral-700);\">Modelos mais avançados descontam mais tokens por resposta (multiplicador).<\u002Fspan><\u002Fdiv>\n    <strong style=\"font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--color-neutral-700); padding:18px 0 2px;\">Recursos de IA<\u002Fstrong>\n    <sc-for list=\"{{ od.recursos }}\" as=\"r\" hint-placeholder-count=\"4\"><div style=\"display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--color-divider);\"><div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;\"><strong style=\"font-size:14px;\">{{ r.titulo }}<\u002Fstrong><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">{{ r.desc }}<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ r.t.toggle }}\" style=\"all:unset; cursor:pointer; position:relative; width:40px; height:24px; flex:none; border-radius:999px; background:{{ r.t.track }};\"><span style=\"position:absolute; top:3px; left:{{ r.t.knob }}; width:18px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fsc-for>\n    <div style=\"height:10px;\"><\u002Fdiv>\n    <div style=\"display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--color-divider);\"><div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;\"><strong style=\"font-size:14px;\">Ativar automaticamente para novos chats<\u002Fstrong><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">A IA assume as conver r:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-sm); padding:20px 24px; display:flex; flex-direction:column;\">\n    <div style=\"display:flex; flex-direction:column; gap:2px; margin-bottom:4px;\"><h3 style=\"margin:0; font-size:17px;\">O que a IA consulta no CRM<\u002Fh3><span style=\"font-size:13px; color:var(--color-neutral-700); text-wrap:pretty;\">A cada resposta, o sistema busca estes dados atualizados da organização e entrega para a IA junto com o prompt.<\u002Fspan><\u002Fdiv>\n    <sc-for list=\"{{ od.consultas }}\" as=\"c\" hint-placeholder-count=\"4\"><div style=\"display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--color-divider);\"><div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;\"><strong style=\"font-size:14px;\">{{ c.titulo }}<\u002Fstrong><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">{{ c.desc }}<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ c.t.toggle }}\" style=\"all:unset; cursor:pointer; position:relative; width:40px; height:24px; flex:none; border-radius:999px; background:{{ c.t.track }};\"><span style=\"position:absolute; top:3px; left:{{ c.t.knob }}; width:18px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fsc-for>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px; padding-top:16px;\"><div class=\"field\"><label>Endereço da loja / retirada<\u002Flabel><input class=\"input\" placeholder=\"Rua, número, bairro, cidade\" value=\"{{ od.endereco }}\" sc-camel-on-change=\"{{ od.on_endereco }}\"><\u002Fdiv><div class=\"field\"><label>Horário de atendimento<\u002Flabel><input class=\"input\" placeholder=\"Ex.: Seg a sáb, 9h às 18h\" value=\"{{ od.horario }}\" sc-camel-on-change=\"{{ od.on_horario }}\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"field\" style=\"padding-top:12px;\"><label>Outras informações da empresa<\u { v.k }}<\u002Fcode><span style=\"color:var(--color-neutral-700);\">{{ v.d }}<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ od.abrirSim }}\">Simulador<\u002Fbutton><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ od.salvar }}\">{{ od.salvarLabel }}<\u002Fbutton><\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ isOrgs }}\">\n<div data-screen-label=\"Organizações\" style=\"flex:1; overflow-y:auto; padding:28px 32px 36px; display:flex; flex-direction:column; gap:18px;\">\n  <div style=\"display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap;\"><div style=\"flex:1; min-width:220px;\"><span style=\"font-size:13px; font-weight:600; color:var(--color-accent-700);\">Administração · Clientello<\u002Fspan><h1 style=\"margin:2px 0 0; font-size:30px; font-weight:800; letter-spacing:-.025em;\">Organizações<\u002Fh1><\u002Fdiv><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ novaOrg }}\" style=\"min-height:40px;\">+ Criar organização<\u002Fbutton><\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px;\">\n    <div style=\"background:var(--card); border:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-sm); padding:18px 20px; display:flex; flex-direction:column; gap:4px;\"><span style=\"font-size:13px; color:var(--color-neutral-700);\">Organizações<\u002Fspan><strong style=\"font-size:26px; font-weight:800;\">{{ admCount }}<\u002Fstrong><\u002Fdiv>\n    <div style=\"background:var(--card); border:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-sm); padding:18px 20px; display:flex; flex-direction:column; gap:4px;\"><span style=\"font-size:13px; color:var(--color-neutral-700);\">Assentos em uso<\u002Fspan><strong style=\"font-size:26px; font-weight:800;\">{{ admSeats }}<\u002Fstrong><\u002Fdiv>\n    <div style=\"background:var(--card); border:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-sm); padding:18px 20px; display:flex; flex-direction:column; gap:4px;\"><span style=\"font-size:13px; color:var(--color-neutral-700);\">Tokens distribuídos<\u002Fspan><strong style=\"font-size:26px; font-weight:800;\">{{ admTokens }}<\u002Fstrong><\u002Fdiv>\n  <\u002Fdiv>\n  <section style=\"background:var(--card); border:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-sm); overflow-x:auto; flex:none;\">\n    <div style=\"min-width:1080px;\">\n      <div style=\"display:grid; grid-template-columns:minmax(200px,1.3fr) minmax(220px,1.4fr) 100px 130px minmax(150px,1fr) 110px 170px; gap:12px; padding:12px 20px; background:var(--color-surface); font-size:12px; font-weight:700; color:var(--color-neutral-700);\"><span>Nome<\u002Fspan><span>Proprietário<\u002Fspan><span>Assentos<\u002Fspan><span>Saldo de tokens<\u002Fspan><span>Recursos<\u002Fspan><span>Criado em<\u002Fspan><span style=\"text-align:right;\">Ações<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ admOrgs }}\" as=\"o\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid; grid-template-columns:minmax(200px,1.3fr) minmax(220px,1.4fr) 100px 130px minmax(150px,1fr) 110px 170px; gap:12px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--color-divider); font-size:14px; background:{{ o.bg }};\">\n          <span style=\"display:flex; flex-direction:column; min-width:0;\"><strong style=\"overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ o.nome }}<\u002Fstrong><sc-if value=\"{{ o.inativa }}\"><span style=\"font-size:12px; font-weight:700; color:var(--brand-red);\">Bloqueada<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <span style=\"display:flex; flex-direction:column; min-width:0;\"><span style=\"font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ o.prop }}<\u002Fspan><span style=\"font-size:12px; color:var(--color-neutral-700); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ o.email }}<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:ui-monospace, monospace;\">{{ o.assentos }}<\u002Fspan>\n          <span style=\"font-family:ui-monospace, monospace;\">{{ o.tokens }}<\u002Fspan>\n          <span style=\"font-size:12px; color:var(--color-neutral-700);\">{{ o.recursos }}<\u002Fspan>\n          <span style=\"font-size:13px; color:var(--color-neutral-700);\">{{ o.criado }}<\u002Fspan>\n          <span style=\"display:flex; gap:6px; justify-content:flex-end;\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ o.editar }}\" style=\"padding:7px 12px;\">Configurar<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ o.entrar }}\" style=\"padding:7px 12px;\">{{ o.entrarLabel }}<\u002Fbutton><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ admCarregando }}\"><p style=\"padding:20px; margin:0; font-size:13px; color:var(--color-neutral-700);\">Carregando organizações…<\u002Fp><\u002Fsc-if>\n      <sc-if value=\"{{ semAdmOrgs }}\"><p style=\"padding:20px; margin:0; font-size:13px; color:var(--color-neutral-700);\">Nenhuma organização ainda.<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <span style=\"font-size:13px; color:var(--color-neutral-700);\">“Entrar” abre o CRM da organização com acesso de suporte. Para voltar, use o menu do seu nome › Trocar organização.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fmain>\n<sc-if value=\"{{ simAberto }}\"><div sc-camel-on-click=\"{{ sim.fechar }}\" style=\"position:fixed; inset:0; z-index:30; background:rgba(10,12,32,.55); display:flex; justify-content:flex-end;\"><div sc-camel-on-click=\"{{ stop }}\" style=\"background:var(--card); width:min(460px, 100%); height:100%; display:flex; flex-direction:column; box-shadow:var(--shadow-lg);\">\n  <div style=\"padding:18px 20px; border-bottom:1px solid var(--color-divider); display:flex; flex-direction:column; gap:10px;\">\n    <div style=\"display:flex; align-items:center; gap:10px;\"><div style=\"flex:1; display:flex; flex-direction:column;\"><h3 style=\"margin:0; font-size:18px;\">Simulador<\u002Fh3><span style=\"font-size:12px; color:var(--color-neutral-700);\">{{ sim.info }}<\u002Fspan><\u002Fdiv><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ sim.limpar }}\">Limpar<\u002Fbutton><button sc-camel-on-click=\"{{ sim.fechar }}\" title=\"Fechar\" style=\"all:unset; cursor:pointer; width:32px; height:32px; display:grid; place-items:center; border-radius:8px; font-size:20px;\" style-hover=\"background:var(--color-surface)\">×<\u002Fbutton><\u002Fdiv>\n    <div class=\"field\"><label>Nome do contato (teste)<\u002Flabel><input class=\"input\" value=\"{{ sim.nome }}\" sc-camel-on-change=\"{{ sim.on_nome }}\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div ref=\"{{ sim.ref }}\" style=\"flex:1; min-height:0; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; background:var(--color-surface);\">\n    <sc-if value=\"{{ sim.vazio }}\"><p style=\"margin:auto 0; font-size:13px; color:var(--color-neutral-700); text-align:center; text-wrap:pretty;\">Escreva como se fosse a cliente. A IA responde com o prompt e os dados atuais da tela, mesmo sem salvar. Cada resposta desconta tokens da organização.<\u002Fp><\u002Fsc-if>\n    <sc-for list=\"{{ sim.msgs }}\" as=\"m\" hint-placeholder-count=\"0\"><div style=\"align-self:{{ m.align }}; max-width:85%; padding:10px 12px; border-radius:14px; background:{{ m.bg }}; color:{{ m.color }}; font-size:14px; line-height:1.45; white-space:pre-wrap;\">{{ m.texto }}<sc-if value=\"{{ m.temTk }}\"><span style=\"display:block; margin-top:4px; font-size:11px; opacity:.7;\">{{ m.tk }}<\u002Fspan><\u002Fsc-if><\u002Fdiv><\u002Fsc-for>\n    <sc-if value=\"{{ sim.carregando }}\"><div style=\"align-self:flex-start; padding:10px 12px; border-radius:14px; background:var(--card); font-size:13px; color:var(--color-neutral-700);\">Digitando…<\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <sc-if value=\"{{ sim.temCtx }}\"><details style=\"padding:10px 20px; border-top:1px solid var(--color-divider); font-size:12px;\"><summary style=\"cursor:pointer; font-weight:700;\">Ver dados que a IA recebeu<\u002Fsummary><pre style=\"margin:8px 0 0; max-height:180px; overflow:auto; white-space:pre-wrap; font-size:11px; color:var(--color-neutral-700);\">{{ sim.ctx }}<\u002Fpre><\u002Fdetails><\u002Fsc-if>\n  <div style=\"padding:14px 20px; border-top:1px solid var(--color-divider); display:flex; gap:8px;\"><input class=\"input\" placeholder=\"Mensagem da cliente…\" value=\"{{ sim.draft }}\" sc-camel-on-change=\"{{ sim.on_draft }}\" sc-camel-on-key-down=\"{{ sim.key }}\" style=\"flex:1;\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ sim.enviar }}\">Enviar<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ canalAberto }}\"><div sc-camel-on-click=\"{{ cm.fechar }}\" style=\"position:fixed; inset:0; z-index:30; background:rgba(10,12,32,.55); display:grid; place-items:center; padding:24px;\"><div sc-camel-on-click=\"{{ stop }}\" style=\"background:var(--card); border:1px solid var(--color-divider); border-radius:18px; box-shadow:var(--shadow-lg); width:{{ cm.largura }}; max-width:100%; max-height:92vh; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:12px;\">\n  <div style=\"display:flex; align-items:center; gap:10px;\"><h3 style=\"margin:0; flex:1; font-size:20px;\">{{ cm.titulo }}<\u002Fh3><button sc-camel-on-click=\"{{ cm.fechar }}\" title=\"Fechar\" style=\"all:unset; cursor:pointer; width:32px; height:32px; display:grid; place-items:center; border-radius:8px; font-size:20px;\" style-hover=\"background:var(--color-surface)\">×<\u002Fbutton><\u002Fdiv>\n  <sc-if value=\"{{ cm.isNo }}\"><div style=\"display:flex; flex-direction:column; gap:12px;\">\n      <div style=\"display:flex; align-items:center; gap:8px;\"><h3 style=\"margin:0; flex:1; font-size:17px;\">API não oficial · QR Code<\u002Fh3><span class=\"tag\" style=\"padding:3px 10px; background:{{ conNo.tagBg }}; color:{{ conNo.tagColor }};\">{{ conNo.status }}<\u002Fspan><\u002Fdiv>\n      <p style=\"font-size:13px; color:var(--color-neutral-700); margin:0; text-wrap:pretty;\">Conecta um número comum via Evolution API. Sem custo por conversa, mas sem garantia da Meta: o número pode ser bloqueado.<\u002Fp>\n      <sc-if value=\"{{ conNo.mostrarQR }}\"><div style=\"display:flex; gap:16px; align-items:center; flex-wrap:wrap;\">\n        <sc-if value=\"{{ conNo.qrReal }}\"><div role=\"img\" aria-label=\"QR Code\" style=\"width:180px; height:180px; flex:none; border-radius:12px; background-color:#fff; background-position:center; background-size:contain; background-repeat:no-repeat; background-image:{{ conNo.qrBg }};\"><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ conNo.qrDemo }}\"><div style=\"width:180px; height:180px; flex:none; border-radius:12px; display:flex; align-items:flex-end; padding:8px; background:repeating-linear-gradient(45deg, var(--color-neutral-300) 0 6px, var(--color-neutral-100) 6px 12px); font-family:ui-monospace, monospace; font-size:10px;\">QR code (demonstração)<\u002Fdiv><\u002Fsc-if>\n        <span style=\"flex:1; min-width:160px; font-size:13px; text-wrap:pretty;\">No celular: WhatsApp › Aparelhos conectados › Conectar aparelho e aponte para o código. A tela atualiza sozinha.<\u002Fspan>\n      <\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ semNaoOficial }}\"><div style=\"padding:10px 12px; border-radius:12px; background:var(--color-surface); font-size:13px; font-weight:600;\">Recurso não liberado para esta organização. Fale com o suporte Clientello.<\u002Fdiv><\u002Fsc-if><div style=\"display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--color-divider); font-size:14px;\"><span style=\"color:var(--color-neutral-700);\">Número<\u002Fspan><strong>{{ conNo.numero }}<\u002Fstrong><\u002Fdiv>\n      <sc-if value=\"{{ isAdmin }}\"><div style=\"display:flex; gap:8px;\"><sc-if value=\"{{ conNo.podeConectar }}\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ conNo.conectar }}\">{{ conNo.acao }}<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ conNo.conectado }}\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ conNo.desconectar }}\">Desconectar<\u002Fbutton><\u002Fsc-if><\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ cm.temConexao }}\"><strong style=\"font-size:15px; padding-top:8px;\">Comportamento<\u002Fstrong>\n      <div style=\"display:flex; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--color-divider);\"><div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;\"><strong style=\"font-size:14px;\">Ignorar grupos<\u002Fstrong><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">Não receber mensagens de grupos<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ cm.tGrupos.toggle }}\" style=\"all:unset; cursor:pointer; position:relative; width:40px; height:24px; flex:none; border-radius:999px; background:{{ cm.tGrupos.track }};\"><span style=\"position:absolute; top:3px; left:{{ cm.tGrupos.knob }}; width:18px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--color-divider);\"><div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;\"><strong style=\"font-size:14px;\">Atualizar contatos automaticamente<\u002Fstrong><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">Usa o nome do perfil do WhatsApp nos contatos que ainda estão com nome automático. Nomes editados aqui são mantidos.<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ cm.tContatos.toggle }}\" style=\"all:unset; cursor:pointer; position:relative; width:40px; height:24px; flex:none; border-radius:999px; background:{{ cm.tContatos.track }};\"><span style=\"position:absolute; top:3px; left:{{ cm.tContatos.knob }}; width:18px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--color-divider);\"><div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;\"><strong style=\"font-size:14px;\">Rejeitar chamadas<\u002Fstrong><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">Recusa automaticamente chamadas de voz e vídeo<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ cm.tChamadas.toggle }}\" style=\"all:unset; cursor:pointer; position:relative; width:40px; height:24px; flex:none; border-radius:999px; background:{{ cm.tChamadas.track }};\"><span style=\"position:absolute; top:3px; left:{{ cm.tChamadas.knob }}; width:18px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n      <sc-if value=\"{{ cm.rejeita }}\"><div class=\"field\" style=\"padding:10px 0 0 16px;\"><label>Mensagem de rejeição<\u002Flabel><input class=\"input\" placeholder=\"Desculpe, não atendemos ligações. Pode mandar mensagem?\" value=\"{{ cm.msgRej }}\" sc-camel-on-change=\"{{ cm.on_msgRej }}\"><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">Enviada quando uma chamada é recusada (opcional).<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <div style=\"display:flex; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--color-divider);\"><div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;\"><strong style=\"font-size:14px;\">Sempre online<\u002Fstrong><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">Aparecer como online no WhatsApp<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ cm.tOnline.toggle }}\" style=\"all:unset; cursor:pointer; position:relative; width:40px; height:24px; flex:none; border-radius:999px; background:{{ cm.tOnline.track }};\"><span style=\"position:absolute; top:3px; left:{{ cm.tOnline.knob }}; width:18px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--color-divider);\"><div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;\"><strong style=\"font-size:14px;\">Ler mensagens automaticamente<\u002Fstrong><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">Marcar como lidas ao receber<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ cm.tLer.toggle }}\" style=\"all:unset; cursor:pointer; position:relative; width:40px; height:24px; flex:none; border-radius:999px; background:{{ cm.tLer.track }};\"><span style=\"position:absolute; top:3px; left:{{ cm.tLer.knob }}; width:18px; height:18px; border-radius:50%; background:#fff;\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n      <strong style=\"font-size:15px; padding-top:8px;\">Configurações da instância<\u002Fstrong>\n      <div class=\"field\"><label>Nome da instância<\u002Flabel><input class=\"input\" placeholder=\"Ex.: Vendas, Suporte, Marketing\" value=\"{{ cm.nome }}\" sc-camel-on-change=\"{{ cm.on_nome }}\"><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty;\">Opcional. Use para distinguir vários canais do mesmo tipo.<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><label>Atribuição padrão<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ cm.atrib }}\" sc-camel-on-change=\"{{ cm.on_atrib }}\"><sc-for list=\"{{ cm.atribOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><span style=\"font-size:12px; color:var(--color-neutral-7
